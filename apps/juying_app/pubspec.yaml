name: juying
description: JuYing multi-platform family media shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_windows: ^0.4.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/sources.json
    - assets/config/external_source_candidates.json
